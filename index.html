<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoidLauncher</title>
    <meta name="description" content="VoidLauncher — A premium custom Minecraft launcher" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
    <script>
      (function(){
        try {
          var t = localStorage.getItem('voidlauncher-theme');
          // An older/unknown stored value falls back to the default Neon
          // theme (no data-theme attr). Must stay in sync with Theme in
          // src/stores/themeStore.ts.
          var known = (t === 'dark' || t === 'blueprint' || t === 'ember'
            || t === 'phosphor' || t === 'carbon');
          // Liquid Glass is a separate experimental mode, not a theme, so it
          // gets its own sentinel value and replaces the theme instead of
          // recolouring it. Must stay in sync with `applyAppearance` in
          // src/stores/themeStore.ts — same rule, same sentinel ('lg').
          // This runs before React so the first paint is already correct;
          // the store re-applies the identical value once it loads.
          var lg = localStorage.getItem('voidlauncher-liquid-glass') === '1';
          if (lg) {
            document.documentElement.setAttribute('data-theme', 'lg');
            document.documentElement.style.colorScheme = 'dark';
          } else if (known) {
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.style.colorScheme = 'dark';
          }
          // Liquid motion and the gooey trails are always on (no longer user
          // settings); prefers-reduced-motion is honoured by the CSS media
          // blocks and by useGooey in React. Must stay in sync with
          // src/stores/themeStore.ts.
          document.documentElement.setAttribute('data-motion', 'liquid');
          var f = localStorage.getItem('voidlauncher-font');
          var cf = localStorage.getItem('voidlauncher-console-font');
          // Legacy "inter" values are ignored (treated as default).
          if (f === 'monocraft') {
            document.documentElement.setAttribute('data-font', 'monocraft');
          }
          var validCf = (cf === 'auto' || cf === 'default' || cf === 'monocraft');
          if (!validCf) {
            // Migrate from the short-lived "font scope" setting.
            var fs = localStorage.getItem('voidlauncher-font-scope');
            validCf = (fs === 'ui' || fs === 'all' || fs === 'logs');
          }
          if (validCf) {
            var mono = (cf === 'monocraft') ? 'monocraft' : (cf === 'auto' && f === 'monocraft') ? 'monocraft' : null;
            if (mono) {
              document.documentElement.setAttribute('data-font-mono', mono);
            }
          }
        } catch(e) {}
      })();
    </script>
    <style>
      body { background: hsl(230, 25%, 7%); margin: 0; }
      [data-theme="dark"] body, [data-theme="dark"] #splash { background: #000000; }
      [data-theme="ember"] body, [data-theme="ember"] #splash { background: #121110; }
      [data-theme="phosphor"] body, [data-theme="phosphor"] #splash { background: #080D09; }
      [data-theme="carbon"] body, [data-theme="carbon"] #splash { background: #131618; }
      [data-theme="lg"] body, [data-theme="lg"] #splash { background: hsl(228, 26%, 7%); }
      [data-theme="phosphor"] #splash h1 { background: linear-gradient(135deg, #C8F0CE, #6DB37A); }
      [data-theme="phosphor"] #splash-grad stop:first-child { stop-color: #C8F0CE; }
      [data-theme="phosphor"] #splash-grad stop:last-child { stop-color: #6DB37A; }
      [data-theme="phosphor"] .splash-spinner { border-color: rgba(155, 217, 163, 0.16); border-top-color: #9AD8A1; }
      [data-theme="carbon"] #splash h1 { background: linear-gradient(135deg, #C6CFD4, #7D8A92); }
      [data-theme="carbon"] #splash-grad stop:first-child { stop-color: #C6CFD4; }
      [data-theme="carbon"] #splash-grad stop:last-child { stop-color: #7D8A92; }
      [data-theme="carbon"] .splash-spinner { border-color: rgba(174, 185, 192, 0.16); border-top-color: #AAB4BA; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: hsl(230, 25%, 7%);
        transition: opacity 0.4s ease-out;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash svg { width: 64px; height: 64px; margin-bottom: 24px; }
      #splash h1 {
        font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700;
        background: linear-gradient(135deg, hsl(265, 100%, 65%), hsl(200, 100%, 60%));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        margin: 0 0 16px; letter-spacing: 2px;
      }
      .splash-spinner {
        width: 32px; height: 32px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: hsl(265, 100%, 65%);
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#splash-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="splash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="hsl(265, 100%, 65%)" />
            <stop offset="100%" stop-color="hsl(200, 100%, 60%)" />
          </linearGradient>
        </defs>
        <path d="M12 2L2 7l10 5 10-5-10-5z" />
        <path d="M2 17l10 5 10-5" />
        <path d="M2 12l10 5 10-5" />
      </svg>
      <h1>VOIDLAUNCHER</h1>
      <div class="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
