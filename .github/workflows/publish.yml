name: "Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # A tag that disagrees with the project version ships updater metadata
      # for a version the binary does not report (and the updater then loops).
      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NPM_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(awk '/^\[package\]/{f=1} f && /^version *=/{gsub(/[" ]/,"",$3); print $3; exit}' src-tauri/Cargo.toml)
          echo "tag=$VERSION package.json=$NPM_VERSION tauri.conf.json=$TAURI_VERSION Cargo.toml=$CARGO_VERSION"
          if [ "$VERSION" != "$NPM_VERSION" ] || [ "$VERSION" != "$TAURI_VERSION" ] || [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::The release tag does not match the project version. Bump all version files first."
            exit 1
          fi

      # Fail before the expensive build when the App credentials are missing or
      # malformed. The script only prints generic messages, never the values.
      - name: Check release App secrets
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: node .github/scripts/check-release-app-secrets.mjs

      # Build the installer. We deliberately do NOT pass
      # `includeUpdaterJson: true` here: when that step's internal signing
      # fails (wrong TAURI_SIGNING_PRIVATE_KEY secret, etc.) tauri-action
      # silently skips attaching latest.json, and the auto-updater ends up
      # with a half-broken release. We do the signing ourselves in the next
      # step so any failure is loud and visible in the CI log.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "VoidLauncher ${{ github.ref_name }}"
          releaseBody: "See the assets below for the installer."
          releaseDraft: false
          prerelease: false

      - name: Sign installer and generate latest.json
        shell: bash
        env:
          # Required for `gh release download` inside Actions.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # -e: exit on error; -u: fail on unset vars.
          # Do NOT use -x here: bash -x expands and prints every command,
          # including TAURI_SIGNING_PRIVATE_KEY / PASSWORD assignments —
          # that would leak the production signing key into the public CI log.
          set -euo pipefail

          TAG_NO_V="${TAG#v}"
          INSTALLER="VoidLauncher_${TAG_NO_V}_x64-setup.exe"

          echo "Tag:           $TAG"
          echo "Installer:     $INSTALLER"
          echo "OS:            $(uname -a)"

          # ── 1. Normalize the secret to a base64 string the CLI expects ──
          #
          # The tauri CLI's `signer sign` does (in this order):
          #   1. read private_key string from `-k` / `TAURI_SIGNING_PRIVATE_KEY` env
          #      (or read file from `-f` / `TAURI_SIGNING_PRIVATE_KEY_PATH` env)
          #   2. base64-decode that string  →  raw minisign key text
          #   3. parse the minisign key text as a SecretKeyBox
          #   4. decrypt with password
          #
          # So the secret must be a base64-of-minisign-text. The locally-stored
          # file `~/.voidlauncher-update.key` is already in that form. But the
          # GitHub secret may have been pasted in as the raw minisign text
          # (multi-line) instead — handle both.
          #
          # `set -e` is suspended around the candidate test because we expect
          # one of the candidates to "fail" (return non-zero) — that's the
          # probe, not an error.
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > raw_secret.txt
          set +e
            base64 -d < raw_secret.txt > decoded.txt 2>/dev/null
            base64_rc=$?
          set -e

          if [ "$base64_rc" -eq 0 ] && head -1 decoded.txt | grep -q "^untrusted comment:"; then
            echo "Key format: base64-of-minisign-text (matches local key file)"
            KEY_FOR_CLI="$TAURI_SIGNING_PRIVATE_KEY"
          elif head -1 raw_secret.txt | grep -q "^untrusted comment:"; then
            echo "Key format: raw minisign text — base64-encoding for the CLI"
            KEY_FOR_CLI=$(base64 -w 0 < raw_secret.txt)
          else
            {
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is neither base64-of-minisign-text nor raw minisign text."
              echo "::error::Do not paste key material here; check the GitHub secret format instead."
            } >&2
            rm -f raw_secret.txt decoded.txt
            exit 1
          fi
          rm -f raw_secret.txt decoded.txt
          echo "Signing key accepted."

          # ── 2. Fetch the freshly-uploaded installer from the release ──
          gh release download "$TAG" --pattern "$INSTALLER" --output installer.exe
          ls -la installer.exe

          # ── 3. Sign the installer ──
          #
          # Real `tauri signer sign` flags (verified against tauri-cli source
          # `crates/tauri-cli/src/signer/sign.rs`):
          #   -k / --private-key       : base64 string of the key (NOT a file path)
          #   -f / --private-key-path  : file path whose contents are the base64 string
          #       --password           : key password (LONG FORM ONLY; no -w)
          #   <FILE>                   : file to sign (POSITIONAL; no -m)
          #   -t / --trusted-comment   : DOES NOT EXIST — that was the bug.
          #
          # Cleanest approach: pass everything via env vars (the CLI auto-reads
          # `TAURI_SIGNING_PRIVATE_KEY` and `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`).
          # Use the local CLI from node_modules to avoid `npx` flakiness.
          if [ ! -x node_modules/.bin/tauri ]; then
            echo "::error::node_modules/.bin/tauri not found — was 'npm ci' skipped or did it fail?"
            ls -la node_modules/.bin/ 2>/dev/null | head -20 || true
            exit 1
          fi

          TAURI_SIGNING_PRIVATE_KEY="$KEY_FOR_CLI" \
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            node_modules/.bin/tauri signer sign installer.exe

          # ── 4. Generate and validate latest.json ──
          #
          # The generator reads the .sig file directly (so the signature never
          # has to be echoed), validates the tag/version/URL/signature, and
          # refuses to emit a manifest containing one of the signing secrets.
          node .github/scripts/latest-json.mjs generate \
            --tag "$TAG" \
            --repository "$REPOSITORY" \
            --installer "$INSTALLER" \
            --signature-file installer.exe.sig \
            --notes "Release $TAG" \
            --output latest.json \
            --forbid-env TAURI_SIGNING_PRIVATE_KEY,TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          node .github/scripts/latest-json.mjs validate \
            --file latest.json \
            --tag "$TAG" \
            --repository "$REPOSITORY" \
            --installer "$INSTALLER" \
            --signature-file installer.exe.sig \
            --forbid-env TAURI_SIGNING_PRIVATE_KEY,TAURI_SIGNING_PRIVATE_KEY_PASSWORD

          echo "::group::latest.json (public updater manifest)"
          cat latest.json
          echo "::endgroup::"

          # ── 5. Cleanup secrets & intermediates ──
          rm -f raw_secret.txt decoded.txt installer.exe installer.exe.sig

      # Installation token with exactly the permissions needed to create the
      # release branch and its pull request. It is requested only after the
      # installer was built and signed, and it is revoked at job end.
      - name: Create GitHub App token for release PR
        id: release-app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # Publishes latest.json through a protected-branch PR. There is no git
      # push here and no write to main: the script uses the GitHub API to
      # create/update release/latest-json-vX.Y.Z and its PR. Reruns update the
      # same branch/PR without force and without empty commits.
      - name: Publish latest.json via pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node .github/scripts/publish-latest-json.mjs \
            --repo "$REPOSITORY" \
            --tag "$TAG" \
            --manifest latest.json \
            --installer "VoidLauncher_${TAG#v}_x64-setup.exe" \
            --forbid-env GH_TOKEN,TAURI_SIGNING_PRIVATE_KEY,TAURI_SIGNING_PRIVATE_KEY_PASSWORD,RELEASE_APP_PRIVATE_KEY
