name: Bug report
description: Report a problem with VoidLauncher. Please do not include tokens, passwords or account data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve VoidLauncher.

        **Privacy:** never paste access tokens, refresh tokens, session IDs, passwords,
        private keys or account files. The launcher's built-in report preview already
        redacts known secret fields, but you are responsible for the final text.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A short description of the problem.
      placeholder: The launcher crashes when I open...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the problem appeared?
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: input
    id: launcher_version
    attributes:
      label: VoidLauncher version
      description: Shown in Settings → About.
      placeholder: 1.5.0

  - type: input
    id: windows_version
    attributes:
      label: Windows version
      description: For example Windows 11 23H2, x64.
      placeholder: Windows 11, x64

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft version
      description: Leave empty if the problem happens before a game launch.
      placeholder: 1.21.1

  - type: input
    id: loader
    attributes:
      label: Mod loader
      description: Fabric, Forge, NeoForge or Vanilla.
      placeholder: Fabric

  - type: textarea
    id: diagnostics
    attributes:
      label: Additional diagnostics
      description: Paste the report generated by Settings → Diagnostics → Report a bug. Remove anything you do not want to publish.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed access tokens, passwords, session IDs and other account secrets from this report.
          required: true
